name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ShellCheck and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Ensure test tools
        run: |
          if ! command -v shellcheck >/dev/null || ! command -v jq >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y shellcheck jq
          fi

      - name: Static analysis
        run: make lint

      - name: Test suite
        run: make test

      - name: Build release artifacts
        run: make release

      - name: Verify release checksums
        run: |
          cd dist
          sha256sum -c SHA256SUMS
