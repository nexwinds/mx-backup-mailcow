name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Ensure test tools
        run: |
          if ! command -v shellcheck >/dev/null || ! command -v jq >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y shellcheck jq
          fi

      - name: Verify tag matches VERSION
        run: |
          version="v$(tr -d '[:space:]' < VERSION)"
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "VERSION ($version) does not match tag (${GITHUB_REF_NAME})" >&2
            exit 1
          fi

      - name: Static analysis
        run: make lint

      - name: Test suite
        run: make test

      - name: Build release
        run: make release

      - name: Verify release checksums
        run: |
          cd dist
          sha256sum -c SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/mx-backup-mailcow-*.tar.gz \
            dist/SHA256SUMS \
            dist/install.sh \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
